server:
  port: 8002

# Test profile — uses H2 in-memory database and Caffeine cache (via TestCacheConfig)
spring:
  application:
    name: analytics-api-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

# Portal config for test profile — disable Redis cache (no Redis server in tests)
portal:
  datasource:
    enabled: false
  cache:
    enabled: false

ml:
  service:
    url: http://localhost:8000
    token: test-internal-token-for-unit-tests

internal:
  service:
    token: test-internal-token-for-unit-tests

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
