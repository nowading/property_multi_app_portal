server:
  port: 8002

# In tests we use H2 via Spring Boot auto-config; the MySQL HA wiring is
# disabled explicitly so it does not override the test datasource.
portal:
  datasource:
    enabled: false

spring:
  application:
    name: analytics-api-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

spring.cache:
  type: caffeine

ml:
  service:
    url: http://localhost:8000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

spring.jackson:
  date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
  time-zone: UTC