services:
  ml-container:
    build:
      context: ../house_price_prediction
      dockerfile: Dockerfile
    container_name: house-price-ml
    # Phase C: TLS is now mandatory. We override the Dockerfile CMD to
    # pass --ssl-keyfile + --ssl-certfile. The certs/ directory is
    # generated by scripts/generate-certs.ps1 (gitignored).
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ssl-keyfile
      - /app/certs/ml-container.key
      - --ssl-certfile
      - /app/certs/ml-container.crt
    expose:
      - "8000"
    environment:
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-}"
    volumes:
      - ./certs/ml-container.crt:/app/certs/ml-container.crt:ro
      - ./certs/ml-container.key:/app/certs/ml-container.key:ro
      # Mount the CA so the healthcheck can use it as a trust anchor
      # when probing https://localhost:8000/health from inside the container.
      - ./certs/ca.crt:/app/certs/ca.crt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request, ssl; ctx = ssl.create_default_context(cafile='/app/certs/ca.crt'); urllib.request.urlopen('https://localhost:8000/health', context=ctx, timeout=4)\" || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  estimator-api:
    build:
      context: ./apps/estimator-api
      dockerfile: Dockerfile
    container_name: estimator-api
    expose:
      - "8001"
    environment:
      # Phase C: switch to HTTPS so httpx verifies the ML container cert.
      ML_SERVICE_URL: "https://ml-container:8000"
      ML_CA_BUNDLE_PATH: "/app/certs/ca.crt"
      ESTIMATOR_API_HOST: "0.0.0.0"
      ESTIMATOR_API_PORT: "8001"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-}"
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
    depends_on:
      ml-container:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8001/healthz', timeout=4); sys.exit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  analytics-api:
    build:
      context: ./apps/analytics-api
      dockerfile: Dockerfile
    container_name: analytics-api
    expose:
      - "8002"
    environment:
      # Phase C: switch to HTTPS so JDK HttpClient trusts the ML cert.
      ML_SERVICE_URL: "https://ml-container:8000"
      # analytics-api reads a proper PKCS#12 trust store generated by
      # scripts/generate_certs.py via keytool. The trust store contains
      # a single trustedCertEntry (the project CA), so the JDK can
      # validate the ML container's self-signed cert.
      ML_TRUST_STORE_PATH: "/app/certs/ca.p12"
      ML_TRUST_STORE_PASSWORD: "changeit"
      SERVER_PORT: "8002"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-}"
      # MySQL Database Configuration
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "analytics_db"
      DB_USERNAME: "${DB_USERNAME:-analytics}"
      DB_PASSWORD: "${DB_PASSWORD}"
      # Redis Cache Configuration
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
    volumes:
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/ca.p12:/app/certs/ca.p12:ro
    depends_on:
      ml-container:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - http://localhost:8002/actuator/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: analytics-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: analytics_db
      MYSQL_USER: "${DB_USERNAME:-analytics}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./apps/analytics-api/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    build:
      context: ./apps/redis
      dockerfile: Dockerfile
    container_name: analytics-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - $${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ESTIMATOR_API_URL: "http://localhost:8001"
        NEXT_PUBLIC_ANALYTICS_API_URL: "http://localhost:8002"
        # Server-side URLs for next.config.ts rewrites() — Docker network hostnames
        ESTIMATOR_API_URL: "http://estimator-api:8001"
        ANALYTICS_API_URL: "http://analytics-api:8002"
    container_name: web-portal
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      ESTIMATOR_API_URL: "http://estimator-api:8001"
      ANALYTICS_API_URL: "http://analytics-api:8002"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-}"
    depends_on:
      estimator-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql-data:
  redis-data:
  # Maven local repository cache for analytics-api development (hot-reload mode)
  analytics-maven-cache:

networks:
  app-network:
    driver: bridge