# =============================================================================
# Property Multi-App Portal — Docker Compose
#
# Phase 3-5: orchestrates the ML container, Estimator API (FastAPI),
#             and Analytics API (Spring Boot).
# =============================================================================

services:
  ml-service:
    build:
      context: ../house_price_prediction
      dockerfile: Dockerfile
    container_name: house-price-ml
    ports:
      - "${ML_CONTAINER_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - portal-network

  estimator-api:
    build:
      context: ./apps/estimator-api
      dockerfile: Dockerfile
    container_name: estimator-api
    ports:
      - "${ESTIMATOR_API_PORT:-8001}:8001"
    environment:
      # Inside the compose network, the ML service is reachable by its
      # service name on the default port 8000.
      ML_SERVICE_URL: "http://ml-service:8000"
      ESTIMATOR_API_HOST: "0.0.0.0"
      ESTIMATOR_API_PORT: "8001"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8001/healthz', timeout=4); sys.exit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - portal-network

  analytics-api:
    build:
      context: ./apps/analytics-api
      dockerfile: Dockerfile
    container_name: analytics-api
    ports:
      - "${ANALYTICS_API_PORT:-8002}:8002"
    environment:
      ML_SERVICE_URL: "http://ml-service:8000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - http://localhost:8002/actuator/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge
