# =============================================================================
# Property Multi-App Portal — Docker Compose
#
# Phase 3: orchestrates the ML container + Estimator API (FastAPI).
# Web (Next.js) and Analytics API (Spring Boot) will be added in later phases.
# =============================================================================

services:
  ml-service:
    build:
      context: ../house_price_prediction
      dockerfile: Dockerfile
    container_name: house-price-ml
    ports:
      - "${ML_CONTAINER_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - portal-network

  estimator-api:
    build:
      context: ./apps/estimator-api
      dockerfile: Dockerfile
    container_name: estimator-api
    ports:
      - "${ESTIMATOR_API_PORT:-8001}:8001"
    environment:
      # Inside the compose network, the ML service is reachable by its
      # service name on the default port 8000.
      ML_SERVICE_URL: "http://ml-service:8000"
      ESTIMATOR_API_HOST: "0.0.0.0"
      ESTIMATOR_API_PORT: "8001"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8001/healthz', timeout=4); sys.exit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge
