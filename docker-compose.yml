services:
  ml-container:
    build:
      context: ../house_price_prediction
      dockerfile: Dockerfile
    container_name: house-price-ml
    ports:
      - "${ML_CONTAINER_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  estimator-api:
    build:
      context: ./apps/estimator-api
      dockerfile: Dockerfile
    container_name: estimator-api
    ports:
      - "${ESTIMATOR_API_PORT:-8001}:8001"
    environment:
      ML_SERVICE_URL: "http://ml-container:8000"
      ESTIMATOR_API_HOST: "0.0.0.0"
      ESTIMATOR_API_PORT: "8001"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      ml-container:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8001/healthz', timeout=4); sys.exit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  analytics-api:
    build:
      context: ./apps/analytics-api
      dockerfile: Dockerfile
    container_name: analytics-api
    ports:
      - "${ANALYTICS_API_PORT:-8002}:8002"
    environment:
      ML_SERVICE_URL: "http://ml-container:8000"
      SERVER_PORT: "8002"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    depends_on:
      ml-container:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - http://localhost:8002/actuator/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ESTIMATOR_API_URL: "http://localhost:8001"
        NEXT_PUBLIC_ANALYTICS_API_URL: "http://localhost:8002"
        # Server-side URLs for next.config.ts rewrites() — Docker network hostnames
        ESTIMATOR_API_URL: "http://estimator-api:8001"
        ANALYTICS_API_URL: "http://analytics-api:8002"
    container_name: web-portal
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      ESTIMATOR_API_URL: "http://estimator-api:8001"
      ANALYTICS_API_URL: "http://analytics-api:8002"
    depends_on:
      estimator-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge